services:
  mockit-mcp:
    build: .
    image: mockit-mcp:latest
    container_name: mockit-mcp
    restart: unless-stopped
    ports:
      - "7821:7821"
    environment:
      CLAUDE_BACKEND: ${CLAUDE_BACKEND:-api}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      MCP_TRANSPORT: http
      HTTP_PORT: "7821"
      DESIGNS_DIR: /data/designs
      VIEWPORT_WIDTH: "390"
      VIEWPORT_HEIGHT: "844"
      DEVICE_SCALE: "2"
    volumes:
      - ./designs:/data/designs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7821/health"]
      interval: 30s
      timeout: 5s
      retries: 3
