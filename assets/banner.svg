<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Glow halo behind phone -->
  <ellipse cx="950" cy="200" rx="200" ry="180" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>

  <!-- iPhone frame on the right -->
  <g transform="translate(820, 40)">
    <!-- Phone body -->
    <rect x="0" y="0" width="240" height="320" rx="40" fill="#1a1a1a" stroke="#3a3a3c" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="8" width="224" height="304" rx="32" fill="url(#phoneScreen)"/>
    <!-- Notch / Dynamic Island -->
    <rect x="90" y="20" width="60" height="20" rx="10" fill="#000"/>

    <!-- Sample mockup content -->
    <!-- Status bar text -->
    <text x="20" y="35" fill="#fff" font-size="9" font-weight="600">9:41</text>

    <!-- Header -->
    <text x="20" y="68" fill="#fff" font-size="14" font-weight="700">Discover</text>
    <circle cx="218" cy="64" r="8" fill="#3a3a3c"/>

    <!-- Hero card -->
    <rect x="20" y="80" width="200" height="80" rx="12" fill="url(#cardGrad)" stroke="#0A84FF" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="32" y="105" fill="#0A84FF" font-size="8" font-weight="700" letter-spacing="1">FEATURED</text>
    <text x="32" y="125" fill="#fff" font-size="14" font-weight="700">Generated UI</text>
    <text x="32" y="142" fill="#8e8e93" font-size="9">Premium iOS mockups</text>

    <!-- Cards row -->
    <rect x="20" y="172" width="95" height="60" rx="10" fill="#1c1c1e"/>
    <rect x="125" y="172" width="95" height="60" rx="10" fill="#1c1c1e"/>
    <circle cx="42" cy="195" r="8" fill="#FF375F" opacity="0.8"/>
    <circle cx="147" cy="195" r="8" fill="#34C759" opacity="0.8"/>
    <rect x="32" y="212" width="50" height="4" rx="2" fill="#3a3a3c"/>
    <rect x="137" y="212" width="50" height="4" rx="2" fill="#3a3a3c"/>
    <rect x="32" y="220" width="35" height="3" rx="1.5" fill="#2a2a2c"/>
    <rect x="137" y="220" width="35" height="3" rx="1.5" fill="#2a2a2c"/>

    <!-- List items -->
    <rect x="20" y="244" width="200" height="14" rx="3" fill="#1c1c1e"/>
    <rect x="20" y="262" width="200" height="14" rx="3" fill="#1c1c1e"/>
    <rect x="20" y="280" width="160" height="14" rx="3" fill="#1c1c1e"/>

    <!-- Home indicator -->
    <rect x="80" y="302" width="80" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
  </g>

  <!-- Left: Wordmark + tagline -->
  <g transform="translate(80, 130)">
    <!-- Logo mark -->
    <g transform="translate(0, -20)">
      <rect width="60" height="60" rx="14" fill="url(#accent)"/>
      <rect x="14" y="14" width="32" height="32" rx="6" fill="#0a0a0a"/>
      <rect x="20" y="20" width="20" height="3" rx="1.5" fill="url(#accent)"/>
      <rect x="20" y="27" width="14" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
      <rect x="20" y="34" width="18" height="3" rx="1.5" fill="#fff" opacity="0.4"/>
    </g>

    <!-- Wordmark -->
    <text x="80" y="22" fill="#fff" font-size="56" font-weight="800" letter-spacing="-2">mockit</text>

    <!-- Tagline -->
    <text x="0" y="80" fill="#8e8e93" font-size="20" font-weight="500" letter-spacing="-0.3">Text → premium iOS mockups</text>
    <text x="0" y="108" fill="#5a5a5c" font-size="16" font-weight="400">An MCP server for Claude. Powered by Opus + Playwright.</text>

    <!-- Pills -->
    <g transform="translate(0, 138)">
      <rect width="78" height="28" rx="14" fill="none" stroke="#3a3a3c"/>
      <text x="39" y="18" fill="#8e8e93" font-size="11" font-weight="600" text-anchor="middle">MCP</text>

      <rect x="86" width="78" height="28" rx="14" fill="none" stroke="#3a3a3c"/>
      <text x="125" y="18" fill="#8e8e93" font-size="11" font-weight="600" text-anchor="middle">Self-hosted</text>

      <rect x="172" width="78" height="28" rx="14" fill="none" stroke="#3a3a3c"/>
      <text x="211" y="18" fill="#8e8e93" font-size="11" font-weight="600" text-anchor="middle">Open Source</text>
    </g>
  </g>
</svg>
